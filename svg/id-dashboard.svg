<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Alok Thakur developer ID card and GitHub dashboard">
<defs>
