<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Alok Thakur - Ethical Hacker and Security Researcher">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00ff41"/><stop offset="1" stop-color="#00d4ff"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#00ff41" opacity=".12"/></pattern><style>text{font-family:"Fira Code","Courier New",monospace}.b{font-weight:700}.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}.scan{animation:sc 6s linear infinite}@keyframes sc{from{transform:translateY(-20px)}to{transform:translateY(560px)}}.pulse{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}</style></defs>
<rect width="1000" height="520" rx="22" fill="#050b07" stroke="#00ff41" stroke-opacity=".5"/>
<rect width="1000" height="520" rx="22" fill="url(#dots)"/>
<g class="scan"><rect width="1000" height="3" fill="#00ff41" opacity=".08"/></g>
<rect x="48" y="44" width="300" height="38" rx="19" fill="#00ff41" fill-opacity=".08" stroke="#00ff41" stroke-opacity=".5"/>
<circle class="pulse" cx="72" cy="63" r="5" fill="#00ff41"/>
<text x="88" y="68" font-size="14" fill="#7dffa0">Open to Security Research</text>
<text x="48" y="140" font-size="22" fill="#00d4ff">root@firewall-breaker:~# whoami</text>
<text x="48" y="215" font-size="72" class="b" fill="url(#g)">Alok Thakur</text>
<text x="48" y="268" font-size="26" fill="#e6fff0">&gt; Ethical Hacker<tspan class="blink" fill="#00ff41"> _</tspan></text>
<text x="48" y="312" font-size="15" fill="#9fc9ae">Independent Security Researcher · Tool Builder</text>
<text x="48" y="336" font-size="15" fill="#9fc9ae">Founder of Firewall Breaker, teaching beginners</text>
<text x="48" y="360" font-size="15" fill="#9fc9ae">hands-on ethical hacking.</text>
<text x="48" y="396" font-size="14" fill="#00ff41" opacity=".85">Stay Curious. Stay Secure. Hack Legally.</text>
<g font-size="14">
<rect x="48" y="424" width="150" height="40" rx="20" fill="none" stroke="#00ff41" stroke-opacity=".6"/><circle cx="70" cy="444" r="5" fill="#00ff41"/><text x="86" y="449" fill="#e6fff0">India · IST</text>
<rect x="210" y="424" width="170" height="40" rx="20" fill="none" stroke="#00d4ff" stroke-opacity=".6"/><circle cx="232" cy="444" r="5" fill="#00d4ff"/><text x="248" y="449" fill="#e6fff0">Kali · Parrot</text>
<rect x="392" y="424" width="240" height="40" rx="20" fill="none" stroke="#00ff41" stroke-opacity=".6"/><circle cx="414" cy="444" r="5" fill="#00ff41"/><text x="430" y="449" fill="#e6fff0">github.com/thakur2309</text>
</g>
<!-- terminal window -->
<rect x="660" y="44" width="300" height="432" rx="16" fill="#02070a" stroke="#00ff41" stroke-opacity=".6"/>
<rect x="660" y="44" width="300" height="34" rx="16" fill="#00ff41" fill-opacity=".1"/>
<circle cx="682" cy="61" r="5" fill="#ff5f56"/><circle cx="700" cy="61" r="5" fill="#ffbd2e"/><circle cx="718" cy="61" r="5" fill="#27c93f"/>
<text x="760" y="66" font-size="12" fill="#6fae85">kali@firewall:~</text>
<g font-size="13">
<text x="680" y="112" fill="#00ff41">$ nmap -sV target.lab</text>
<text x="680" y="138" fill="#6fae85">22/tcp  open  ssh</text>
<text x="680" y="158" fill="#6fae85">80/tcp  open  http</text>
<text x="680" y="178" fill="#6fae85">443/tcp open  https</text>
<text x="680" y="214" fill="#00ff41">$ python3 recon.py --scope ok</text>
<text x="680" y="240" fill="#6fae85">[+] authorized test only</text>
<text x="680" y="260" fill="#6fae85">[+] report generated</text>
<text x="680" y="296" fill="#00ff41">$ echo $MOTTO</text>
<text x="680" y="322" fill="#00d4ff">Stay Curious. Stay Secure.</text>
<text x="680" y="358" fill="#00ff41">$ sudo learn --more<tspan class="blink"> █</tspan></text>
</g>
