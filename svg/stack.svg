<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Alok Thakur technology and cybersecurity toolkit infographic">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B10"/><stop offset=".55" stop-color="#0B141B"/><stop offset="1" stop-color="#081D1A"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00E5A8"/><stop offset="1" stop-color="#73FFD4"/></linearGradient>
