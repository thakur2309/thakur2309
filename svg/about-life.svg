<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-label="About Alok Thakur, cybersecurity interests and builder philosophy">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B10"/><stop offset=".55" stop-color="#0B141B"/><stop offset="1" stop-color="#081D1A"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00E5A8"/><stop offset="1" stop-color="#73FFD4"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#111F27"/><stop offset="1" stop-color="#0A1218"/></linearGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#18352F" stroke-width="1" opacity=".45"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
 <style>
 .mono{font-family:'Courier New',monospace} .sans{font-family:Arial,Helvetica,sans-serif}
 .muted{fill:#8FA3A0} .white{fill:#EAF5F2} .green{fill:#00E5A8}
 .tiny{font-size:12px;letter-spacing:1.5px} .label{font-size:14px;letter-spacing:2px}
 .head{font-size:30px;font-weight:700;letter-spacing:1px}
 .panel{fill:url(#panel);stroke:#24443C;stroke-width:1.3}
 </style>
</defs>
<rect width="1200" height="550" rx="24" fill="url(#bg)"/>
<rect width="1200" height="550" rx="24" fill="url(#grid)"/>
<circle cx="1120" cy="45" r="90" fill="#00E5A8" opacity=".055" filter="url(#soft)"/>

